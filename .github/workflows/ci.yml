name: Frontend CI/CD

on:
  push:
    branches: [main, master, paymentw]
  pull_request:
    branches: [main, master]

jobs:
  # CI Job: Tests & Lint
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run Lint
        run: bun run lint:check
      - name: Run Tests
        run: bun run test

  # CD Job: Build & Package (Continuous Delivery)
  build:
    name: Build & Package Artifact
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/paymentw')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build Production Bundle
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-bundle
          path: .next/
