groups:
  - name: accountia_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Instance {{ $labels.instance }} down'
          description: "{{ $labels.job }} a cessé de répondre depuis plus d'une minute."

      - alert: HighProcessMemoryUsage
        expr: process_resident_memory_bytes > 200000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High memory usage on {{ $labels.job }}'
          description: 'Process memory is above 200MB for more than 5 minutes.'
