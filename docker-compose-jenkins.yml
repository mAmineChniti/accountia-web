services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    privileged: true
    user: root
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - C:\Users\Asus\Desktop\accountia-web:/var/jenkins_home/workspace/accountia-web
      - C:\Users\Asus\Desktop\accountia-api:/var/jenkins_home/workspace/accountia-api
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: always
