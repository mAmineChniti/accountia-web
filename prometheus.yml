global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'accountia-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:4789']

  - job_name: 'accountia-web'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000'] # L'adresse de ton Frontend Next.js
